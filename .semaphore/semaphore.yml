version: v1.0
name: timeseries-java
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
global_job_config:
  env_vars:
    - name: TERM
      value: dumb
blocks:
  - name: 'Commit Suite & Build'
    task:
      jobs:
        - name: 'Build'
          commands:
            - checkout
            - sem-version java 21
            - .semaphore/build.sh
promotions:
  - name: Publish to packages
    pipeline_file: publish.yml
